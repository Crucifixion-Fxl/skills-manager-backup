interface:
  display_name: "User Research"
  short_description: "Run Project research from VOC to an unsent Brevo draft"
  default_prompt: "Use $audience-user-research with the injected Audience Project key. Discover the authenticated Project and exact grants from self-context; its optional research_track defaults to the legacy materialized_audience workflow only when absent. Never infer Project, track or grants from name or token. Follow exact API readback for Idea, optional native VOC, and Typeform. Only an explicit questionnaire_only track permits that branch: create a Project-owned form or reuse a same-Project Research form via source_research_id, then publish/read answers without selection, materialization, Brevo or Campaign Draft. For materialized_audience, continue those steps only when requested. Stop on ambiguous effects without direct provider access."
