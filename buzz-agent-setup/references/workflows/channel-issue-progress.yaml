# Generate with render_channel_issue_workflow.py. Enable only after channel-specific gates pass.
name: channel-issue-progress
description: 每日北京时间22:00汇总24小时频道讨论，完成后维护对应已有Issue的进展。
enabled: false
trigger:
  on: schedule
  # UTC 14:00 = Asia/Shanghai 22:00；每天，包括周末。不要再加8小时。
  cron: "0 14 * * *"
steps:
  - id: wake
    action: send_message
    text: >-
      @__AGENT_NAME__ 使用 $addx:channel-issue-progress。
      [channel-issue-wake:v1] 对象为本Workflow绑定的当前频道；每天北京时间22:00启动。
      以本次计划触发时刻的22:00为固定终点，汇总前24小时（起点含、终点不含）；
      延迟运行优先用原计划日期；无run日期时按可信唤醒创建时间转北京时间，达到22:00取当天，否则取前一天；注明事件时间口径，不猜原日期。
      完整读取根消息与线程，纳入人类和AI原创的实质讨论进展；同步镜像与自身回执去重。
      回读可信当前Canvas，仓库取固定授权交集；识别对应已有Issue，处理完成后追加进展评论与来源。
      每项讨论须为已读回写入、已存在证据、非实质消息或明确待处理；未匹配/多义/无权不丢弃。
      不自动新建Issue、修改负责人/状态、扩权限、实施或合并。
      普通评论用现有身份和工具：唯一目标、写前读相关评论查重、写后GET回读；缺资料/权限只暂停相关项；
      未知写结果只读对账，不盲重试，不推进未完成范围。
      结果回本次Workflow原Thread，带[channel-issue-result:v1]，只列目标链接和真实计数。
      查重为best-effort，不承诺并发原子幂等；发现重复读回核对，报告并更正自有重复评论。
      全部目标处理完成后，在本次来源群/Channel 发一条简短完成摘要：逐项列出已GET读回确认更新的Issue链接、变化摘要；
      no-op、待确认和失败单独计数，无成功更新时如实说明。仅向原授权群/Channel发送，使用结果marker与稳定批次键去重；
      发送后同身份读回，未知发送结果只读对账，不重复广播；不复制逐字稿、凭据或受限原文。
      原Thread回执已满足同批次摘要时复用，不另发第二条同内容群消息。
      通知键取频道+固定计划窗口，不使用随机run/措辞；
      原Thread回执沿用best-effort查重和发送后读回，不要求新writer/锁/账本；已有独立广播发送器才按其单writer/锁持久pending契约执行，未知结果只读对账。
