display_name: NineData
short_description: Query NineData datasources, run read-only SQL, and operate governed SQL Tasks through controlled OpenAPI.
default_prompt: Use the NineData Skill to list datasources, run read-only DQL or metadata checks through sql-execute, and route DML/DDL/DCL/TCL or mixed SQL batches to SQL Task workflows with review, approval, execution, diagnostics, suspend, resume, stop, cancel, and cancel-execute controls. Never approve, reject, or transfer approval unless the user explicitly confirms that exact action. Summarize requestId, taskId or executionId, status or decision, nextAction, and result evidence. For SQL Task results, whenever consoleUrl is returned, the final response must include that jump link so the user can open the task detail page.
