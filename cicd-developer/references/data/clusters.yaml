# clusters.yaml
#
# K8s 路由/历史查表。16 条记录（11 Ops + 4 Builder + 1 CICD 基础设施），
# 其中 cn-eks-dev 已退役；条目数不是当前可部署集群数，也不是 fleet scanner 巡检数。
# 部署前必须检查 deployment_status；历史条目只供 Review/Troubleshoot 定位。
# tier 与 vault 域绑定：所有 tech-service tier（4 集群）一律 ops 域，
# 不得消费 builder vault；builder dev/staging 集群不得消费 ops vault。
# TKE cn-k8s 是 ops 域特例：部署在 cn-k8s 的服务即使 env=staging 也使用 ops vault。详见
# references/vault-paths/domain-binding.md。
#
# 消费方：
#   - workflows/*.md（先检查 deployment_status，再查 account_id / harbor / runner_tags / vault_css）
#   - troubleshooting/*.md（诊断时按集群查 cloud / region）
#   - workflows/add-sentry.md 用 region 查询 sentry-instances.yaml；Sentry 的 prod 实例不改变应用 ENV/Vault 域
#
# 这是只读数据。新集群上线由平台团队通过 MR 加入；workflow 不修改这个文件。
#
# Schema：
#   clusters[]:
#     name             集群规范名（其他 yaml 引用的 key）
#     deployment_status allowed | retired；allowed 仅表示路由准入，不代替 live readiness。
#                       Build 写入前必须为 allowed；retired / 未知 / 缺失均 STOP。
#     lifecycle_evidence 退役等状态变更的权威仓库证据链接（按需）
#     domain           ops | builder | cicd-infra
#     region           us | eu | cn | sg
#     cloud            aws | gcp | tencent
#     account_id       AWS account id（字符串）| GCP project id | Tencent uin
#     partition        aws | aws-cn （仅 cloud=aws 时存在；用于 IRSA ARN / S3 ARN 渲染）
#                      cloud=gcp/tencent 无此字段 —— IRSA / 跨 AWS 资源 workflow 见此字段缺失即 STOP
#     aws_region       完整 AWS region 名（仅 cloud=aws 时存在）；如 us-east-1 / eu-central-1 / cn-northwest-1 / ap-southeast-1
#                      用于 RDS / S3 / KMS Crossplane CR 的 forProvider.region；workflow 不要凭印象推导
#     argocd_apps_dir  在 argocd-apps 仓库的子目录名（带斜杠结尾）
#     argocd_url       ArgoCD WebUI URL（null = 当前未配置独立 ArgoCD WebUI）
#     casdoor_url      Casdoor SSO URL
#     harbor_url       Harbor registry URL
#     vault            vault 实例 key（在 references/vault-paths/instances.yaml 中查）
#     vault_css        集群内 ClusterSecretStore 名字
#     runner_tags      GitLab runner tag 列表
#     build_mode       dual-arch | single-arch-amd64

clusters:

