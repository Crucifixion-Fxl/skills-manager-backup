    argocd_apps_dir: aws-302571458622-us-prod/
    argocd_url: argocd-us.addx.live
    casdoor_url: casdoor-us.addx.live
    harbor_url: harbor-30257-us-prod.addx.live
    vault: vault-us-prod
    vault_css: vault-backend
    runner_tags: [us-prod-amd64, us-prod-arm64]
