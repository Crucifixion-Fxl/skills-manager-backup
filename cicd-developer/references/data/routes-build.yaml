# routes-build.yaml
#
# 用户意图 -> workflow 文件 的路由表（"build" 模式）。
#
# LLM 流程：
#   1. 把用户显式提出的每项能力与 keywords 比对，先列出候选。
#   2. 一个新服务 + 附加能力：先跑新服务，再按本文件顺序跑每个附加 workflow。
#      多个独立附加能力也按本文件顺序跑；同一能力有多个同样合理候选则问一个澄清问题。
#   3. 未匹配到 route 时 STOP，收集需求并产 Ops Todo；不要按“最接近”workflow 生成 YAML。
#   4. 打开每个已选 workflow_file，从头到尾按 step 执行。
#
# 消费方：
#   - SKILL.md（指向本唯一 inventory）
#   - LLM 路由判断
#
# Schema：
#   intent           简短标签
#   keywords         触发词列表（小写、无标点）
#   workflow_file    workflow 文件相对路径
#   internal_calls   隐式前置 workflow（如 interview-cd-requirements）
#   mode_keywords    可选；把 route 的精确关键词机械绑定到 workflow mode
#   status           omitted | planned（planned = 占位，文件还没写）
#
# planned 路由是显式 STOP，不是"让 LLM 按名字现编一个 workflow"：
# 命中 planned entry 时，输出 Ops Todo / issue 输入，说明该 workflow 尚未实现，
# 不要打开不存在的 workflow_file，也不要从相似 workflow 推导 YAML。

