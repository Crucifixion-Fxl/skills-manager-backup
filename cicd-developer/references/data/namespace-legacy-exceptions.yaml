# Exact, time-bounded legacy namespace identities that require a coordinated
# migration. Every identity dimension and exception_id is mandatory so no
# sibling Application, overlay, app, cluster, or namespace can inherit one.
# A control's owner is the accountable owner for review and removal; machine
# authorization comes only from the exact identities below, not from owner text.
# The same active exact Application identity may retain its registered historical
# target suffix in check_argocd_application.py without adding that suffix to the
# env-keyword routing SSOT. All non-name Application contracts still apply.
# Repository-bound identities declare their complete binding set atomically:
# Application manifest repository plus source repository/path, or Kustomization
# repository. Partial bindings are invalid and never widen a legacy identity.
# expires_on is the last valid UTC calendar date.

