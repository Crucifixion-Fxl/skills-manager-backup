        - "apps/*"
        - "batch/CronJob"
        - "external-secrets.io/*"
        - "generators.external-secrets.io/*"
        - "operator.victoriametrics.com/*"
        - "oss.grafana.m.crossplane.io/*"
        - "s3.aws.m.upbound.io/Bucket"
      must_not_include:
        - "iam.aws.upbound.io/*"
