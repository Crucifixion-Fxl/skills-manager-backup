# =============================================================================
# 集群级 / 跨账号操作（必须运维做）
# =============================================================================
platform_level_operations:
  - 账号级 AWS 策略（Permissions Boundary / 跨账号 sts:AssumeRole trust）
  - GitLab project 转 group / shared_runners_enabled
  - DEV/argocd-apps 仓库 MR review + 合并
  - DEV/k8s 仓库 cicd/base/* 或 cicd/apps/* 改动（Kyverno policy / Image Updater config 等）
  - DEV/vault-policies 仓库 MR（platform-admin 白名单 / role 定义）
  - DEV/base-images images.yaml MR（同步外部镜像到当前配置的目标 Harbor base/）
  - 集群 NodePool / Karpenter / Cluster Autoscaler 配置
  - DNS 解析（addx.live 阿里云 DNS / internal.addx.live 等）
  - WAFv2 ACL 创建（如果走 default ProviderConfig 而非专属 chain）
