apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-reader-streampark-job-pull
  namespace: staging-streampark-jobs
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-vault-reader-streampark-job-pull-tokenrequest
  namespace: staging-streampark-jobs
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  resourceNames:
  - eso-vault-reader-streampark-job-pull
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-vault-reader-streampark-job-pull-tokenrequest
  namespace: staging-streampark-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-vault-reader-streampark-job-pull-tokenrequest
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-streampark-job-pull-reader
  namespace: staging-streampark-jobs
  labels:
    security.addx.io/managed-by: streampark-platform
    security.addx.io/reader-type: platform
    security.addx.io/cluster: aws-390709477306-us-staging
    security.addx.io/vault-domain: ops
    security.addx.io/vault-region: us
spec:
  provider:
    vault:
      server: https://vault-us-new.addx.live
      path: secret
      version: v2
      auth:
        jwt:
          path: jwt-eks-us-staging
          role: eso-platform-streampark-job-pull-reader
          kubernetesServiceAccountToken:
            audiences:
            - https://vault-us-new.addx.live
            expirationSeconds: 600
            serviceAccountRef:
              name: eso-vault-reader-streampark-job-pull
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streampark-job-pull
  namespace: staging-streampark-jobs
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: vault-streampark-job-pull-reader
  target:
    name: streampark-job-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
  - secretKey: .dockerconfigjson
    remoteRef:
      key: prod/docker-builder/application/streampark/registry-pull/us-staging
      property: dockerconfigjson
