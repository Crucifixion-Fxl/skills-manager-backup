{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "labels": {
      "app.kubernetes.io/managed-by": "gitops",
      "app.kubernetes.io/part-of": "buildbarn",
      "buildbarn.addx.io/metrics-role": "frontend"
    },
    "name": "bb-cache-metrics",
    "namespace": "prod-buildbarn"
  },
  "spec": {
    "ports": [
      {
        "name": "metrics",
        "port": 9980,
        "protocol": "TCP",
        "targetPort": 9980
      }
    ],
    "selector": {
      "app": "bb-frontend"
    },
    "type": "ClusterIP"
  }
}
