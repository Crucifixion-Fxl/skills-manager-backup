# Shared MSK SASL/SCRAM bootstrap brokers for the 6 shared-middleware clusters.
# Source of truth: live Crossplane Cluster `.status.atProvider.bootstrapBrokersSaslScram`.
# Verified: 2026-07-08.
#
# Developer-facing contract:
# - Developers do not need, and usually do not have, tech-service/Crossplane kubectl access.
# - KafkaScramCredential writes username/password/bootstrap_brokers_sasl_scram to Vault path
#   secret/{env}/kafka/application/{app}/sasl.
# - cicd-developer / platform maintainers use this YAML or live Crossplane status only to
#   verify or refresh the broker facts that the Composition pushes to Vault.

version: 1
listener:
  protocol: SASL_SSL
  sasl_mechanism: SCRAM-SHA-512
  port: 9096
source:
  api_resource: clusters.kafka.aws.m.upbound.io
  namespace: crossplane-system
  field: status.atProvider.bootstrapBrokersSaslScram
  refresh_command_template: >-
    kubectl --context <context> -n crossplane-system get
    clusters.kafka.aws.m.upbound.io <shared_msk_name>
    -o jsonpath='{.status.atProvider.bootstrapBrokersSaslScram}'

clusters:
  staging-us:
    fleet_name: US Staging
    env_keyword: staging-us
    context: us-eks-staging
    cloud: aws
    account_id: "390709477306"
    region: us-east-1
    shared_msk_name: staging-us-shared-msk
    external_name: arn:aws:kafka:us-east-1:390709477306:cluster/staging-us-shared-msk/344814ca-2483-4f9e-b28f-4eabc6abe105-11
    bootstrap_brokers_sasl_scram: b-1.stagingussharedmsk.pzq8zr.c11.kafka.us-east-1.amazonaws.com:9096,b-2.stagingussharedmsk.pzq8zr.c11.kafka.us-east-1.amazonaws.com:9096,b-3.stagingussharedmsk.pzq8zr.c11.kafka.us-east-1.amazonaws.com:9096
    brokers:
      - b-1.stagingussharedmsk.pzq8zr.c11.kafka.us-east-1.amazonaws.com:9096
      - b-2.stagingussharedmsk.pzq8zr.c11.kafka.us-east-1.amazonaws.com:9096
      - b-3.stagingussharedmsk.pzq8zr.c11.kafka.us-east-1.amazonaws.com:9096

