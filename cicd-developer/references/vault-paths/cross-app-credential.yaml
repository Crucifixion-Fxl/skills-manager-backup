# vault-cross-app-credential.yaml
#
# 跨 app 共享同一个凭据的处理方案（典型场景：两个 app 都连同一个第三方 SaaS、
# 同一个公网 MySQL CDB、同一个 Stripe webhook secret）。
#
# 三个方案，A 优先，B 次之，列出来的 forbidden 必须拒绝。
#
# 消费方：
#   - references/vault-paths/resolver.md（人工查应该用哪个方案）
#   - workflows/*.md（写 ExternalSecret / PushSecret 时判断方案）
#
# Schema：
#   preferred:           推荐方案
#   fallback:            次选方案
#   forbidden[]:         禁止方案 + 拒绝理由

preferred:
  name: A - 跨 app reference
  description: |
    选一个 app 作 owner。业务凭据由 GitOps reconciler 写入
    secret/{env}/app/<owner>/<key>；DB 等平台资源凭据写入
    secret/{env}/<platform>/application/<owner>/<key>。
    其他 app 的 ExternalSecret 的 `remoteRef.key` 字段直接指向 owner 路径，
    跨 app 读不需要改 vault policy（ESO ClusterSecretStore 用 K8s JWT auth +
    external-secrets-policy 全权 read secret/data/*）。
  when_to_use: |
    默认选这个；要求 owner/consumer 在同一 Vault 域并且权限契约相同。单一数据源，
    rotation 一次两端同步生效。需要给 consumer 新建更小权限账号时不属于凭据复用，
    必须走 GitOps 高层 claim/Composition；能力不存在则 STOP + Ops Todo。
  forbidden: false
  history: |
    DEV/gitlab-vault-sync MR !32 关闭时明确：
    "Pod 不受路径限制，SSoT 走 ExternalSecret 直接引用对方路径，不动 policy"

fallback:
  name: B - legacy 双写
  description: |
    两个 app 已有各自 canonical 路径（业务凭据走 app 路径，平台资源凭据走 platform 路径），
    由同一 GitOps controller/reconciler 扇出同值并统一轮换。
  when_to_use: |
    仅维持已登记 legacy；新接入不得人工双写。没有自动 reconciler 时 STOP + Ops Todo。
  forbidden: false

forbidden:

  - name: manual-platform-credential-fanout
    description: 人工创建数据库账号并用 Vault UI/CLI 向 consumer platform path 双写凭据
    reason: |
      平台资源交付必须由 GitOps desired state 驱动。路径 canonical 只证明分类正确，
      不证明资源存在或允许人工 seed；应补 owner claim/Composition/controller。

  - name: pseudo-shared-app
    pattern: "secret/{env}/app/shared/*"
    reason: |
      违反"一条路径一个 app 所有权"原则。`shared` 不是任何 app；后续 rotation /
      audit / 权限继承都没人负责。

  - name: cicd-path-for-business
    pattern: "secret/cicd/<service>/<business-credential>"
    reason: |
      红线 7a——业务凭据 **永不** 进 cicd 路径。cicd 路径只给平台工具链自身用
      （ArgoCD/Casdoor/Harbor/gitlab-runner 等）。

  - name: mutate-owner-group-policy
    description: 给 app-*-owner identity group 加跨 app 的 read policy
    reason: |
      gitlab-vault-sync 由 reconcile.go:368 模板硬编码渲染 owner policy，
      **不支持** 自定义额外路径；手动改的 policy 会被下一轮 reconcile 覆盖。
      MR !32 关闭原因之一就是 ESO global read 已经解决此场景，无需引入此机制。
