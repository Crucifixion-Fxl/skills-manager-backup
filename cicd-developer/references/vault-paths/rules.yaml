# vault-paths/rules.yaml
#
# Vault 路径解析规则。给 (env, kind, app, key)，按 order 顺序找第一条 when 命中
# 的 rule，套 output_template 生成路径。
#
# 同时被以下两边消费：
#   - references/vault-paths/resolver.md          resolver 说明（人工查规则用）
#   - validators/check_vault_paths.py  路径校验器（regex 字段用作匹配模式）
#
# 加新规则或改 regex 只动这一个文件——recipe 和 validator 自动跟上。
#
# Schema：
#   rules[]:
#     order              规则执行顺序（top-to-bottom，命中即停）
#     name               简短规则名（其他文档引用）
#     when               规则适用条件（一句话叙述）
#     output_template    输出路径模板，槽位：{env} {platform} {app} {key} {component}
#     regex              校验器用的正则（必须能匹配 output_template 生成的所有路径）
#     legacy             true = 老路径模式，workflow 不再生产，但 validator 接受
#                              已有文件的引用
#     notes              规则细节、踩坑说明
#
#   examples[]:           input -> output 对照表，可由 resolver 自检
#
#   forbidden_patterns[]: workflow 禁止输出、validator 必须拦下的模式

rules:

  - order: 1
    name: cicd-tooling
    when: |
      凭据归属是 CI/CD 工具链自身（ArgoCD 拉 Git、Casdoor 连 MySQL、Harbor 后端 S3、
      GitLab Runner 注册 token、vault-sync 服务、平台服务间 PAT 等）。
    output_template: "secret/cicd/{component}/{key}"
    regex: "^secret/cicd/[a-z0-9-]+(/.+)?$"
    legacy: false
    notes: |
      <component> 是平台工具链的子命名空间（argocd / casdoor / harbor /
      gitlab-runner / sentry ...）。一个组件一个子目录，不混用。
      业务 app 哪怕只在 CI 里用某个凭据也不归此处——按归属走
      platform-resource-credential（平台资源凭据）或 app-owned-business-credential（app 自有）。

  - order: 2
    name: platform-resource-credential
    when: |
      Crossplane / Platform Admin 代签发给 app 的平台资源凭据：RDS / Aurora /
      Redis / MongoDB(DocumentDB) / Kafka(MSK) / ScyllaDB / ClickHouse / Qdrant / Nacos / Elasticsearch /
      Sentry DSN / OIDC client secret / 公网外部 MySQL / Feishu / Payload CMS /
      GrowthBook / AWS IAM key。人员访问仅由 vault-policies 的平台管理员/超级管理员策略授权；
      GitLab 应用 Maintainer+/Developer+ 不因项目身份获得该路径读写，ESO 使用独立机器策略。
      共享中间件（dev/staging 默认多 app 共用一个实例）在该实例上为每个 app 签发
      **独立的 per-app database/user 或连接凭据**，凭据同样落这里——**没有**单独的 shared-middleware
      Vault 命名空间。申请流程见 workflows/add-rds.md / add-redis.md（kind: Database）和
      references/shared-middleware/README.md（KafkaScramCredential）。
    output_template: "secret/{env}/{platform}/application/{app}/{key}"
    regex: "^secret/(dev|staging|pre|prod)/(aws|oci|auth|rds|aurora|redis|mongodb|kafka|scylla|nacos|elasticsearch|clickhouse|mysql|qdrant|sentry|feishu|payload|growthbook|zitadel)/application/[a-z0-9_-]+/.+$"
    legacy: false
    notes: |
      <platform> 必须取自 vault-paths/platforms.yaml 的 platforms{} 枚举；workflow 不
      允许凭印象增加新 platform，必须先在 yaml 里登记。
      ⚠️ app 段允许**下划线**（[a-z0-9_-]）：shared-middleware 自助 `kind: Database` 的
      `spec.app` 受 `^[a-z][a-z0-9_]+$` 约束（**无连字符**），Composition 按 spec.app 落 vault
      路径，所以 hyphenated app（factory-service / security-comms-backend）的平台路径段是
      下划线（factory_service / security_comms_backend）。消费侧 ExternalSecret 必须读这个
      下划线路径，否则 SecretSyncedError。手动种的外部凭据（非 Composition）仍可用连字符。
      KafkaScramCredential 的 `spec.app` 允许连字符（^[a-z][a-z0-9-]{1,40}$），因此 Kafka path
      通常保留 app 原名，如 `secret/staging/kafka/application/vip-service/sasl`。
      ⚠️ 首段是**裸 env**（dev/staging/pre/prod），**绝不带 region**。staging 三区各连
      各自的 builder Vault 实例（vault-{us,eu,cn}.builder.addx.live），region 由实例隐含，
      写进路径冗余且违规（见 forbidden_patterns 的 env-region-first-segment）。
      共享中间件组件映射：共享 RDS MySQL→platform=rds；ElastiCache/Redis→redis；
      DocumentDB→mongodb；MSK→kafka；ScyllaDB→scylla；ClickHouse→clickhouse；Qdrant→qdrant。

  - order: 3
    name: app-owned-business-credential
    when: |
      app 自己拥有、自己用的业务凭据：第三方 API key、自己签发的 webhook secret、
      业务功能用的密钥等。
      ⚠️ DB / 中间件凭据 **永不** 走这里——哪怕"是我们自己的"也走
      platform-resource-credential 的 platform 路径。app-owned-business-credential
      只给"主人是 app 自己"的业务密钥。
    output_template: "secret/{env}/app/{app}/{key}"
    regex: "^secret/(dev|staging|pre|prod)/app/[a-z0-9-]+/.+$"
    legacy: false
    notes: |
      app 的 GitLab Maintainer+ 全 4 env 可写；Developer 只读 dev/staging。

  - order: 4
    name: legacy-app-not-registered
    when: |
      老应用未注册 gitlab-vault-sync。维持已有路径，**不**迁移。
      workflow 通过读现有 ExternalSecret 检测。
    output_template: "secret/{app}/{env}/..."
    regex: "^secret/[a-z0-9-]+/(dev|staging|pre|prod)(/.+)?$"
    legacy: true
    notes: |
      实际有两个变体：secret/<app>/<env>/* 和 secret/<app>/<env>-<region>/*。
      env-region 变体由 legacy-app-env-region 单独匹配。
      注意：这里 env-region 是 **第二段**（app 名在前），与 forbidden 的
      "env-region 作首段"（secret/staging-us/...）是两回事。

  - order: 5
    name: legacy-app-env-region
    when: |
      老路径变体：env-region 复合（如 staging-us、prod-eu）。
    output_template: "secret/{app}/{env}-{region}/..."
    regex: "^secret/[a-z0-9-]+/(dev|staging|pre|prod)-(us|eu|cn|sg|us-east-1|eu-central-1|eu-west-1|cn-north-1|cn-northwest-1|cn-beijing|cn-shanghai|ap-southeast-1)(/.+)?$"
    legacy: true
    notes: |
      region 既可短名（us/eu/cn/sg）也可现有集群使用的 AWS 全名
      （us-east-1 / eu-central-1 / cn-north-1 / cn-northwest-1 / ap-southeast-1）。

  - order: 6
    name: legacy-dvc-gcp
    when: |
      dvc-remote 的 GCP target 已存在路径 `secret/dvc-remote/staging-us-gcp/{app|database}`。
      ObjectBucket scoped GA 不迁移该存量，也不生产新的 legacy 路径。
    output_template: "secret/dvc-remote/staging-us-gcp/{key}"
    regex: "^secret/dvc-remote/staging-us-gcp/(app|database)$"
    legacy: true
    notes: |
      精确限制 app、target 和两个已存在 key，不能把 `staging-us-gcp` 扩成通用 legacy suffix。

  - order: 7
    name: pre-2026-04-30-rds-infra
    when: |
      2026-04-30 之前接入 fleet 的 RDS master password 老路径
      `secret/{env}/app/<app>/infra`。维持不迁。
      workflow 通过已有 ExternalSecret 检测；不主动写新内容到此路径。
    output_template: "secret/{env}/app/{app}/infra"
    regex: "^secret/(dev|staging|pre|prod)/app/[a-z0-9-]+/infra$"
    legacy: true
    notes: |
      新接入应用 RDS 走 platform-resource-credential（platform=rds），**不**用这个旧位置。

# =============================================================================
# 校对样本：resolver 跑一遍这张表的 input 必须能复现 output 字段。
# =============================================================================
examples:
  - { env: prod, kind: oci, app: naturehood, key: species-correction-video-copy, output: "secret/prod/oci/application/naturehood/species-correction-video-copy" }
  - { env: staging, kind: oci, app: naturehood, key: species-correction-video-copy, output: "secret/staging/oci/application/naturehood/species-correction-video-copy" }
  - { env: staging, kind: aws,    app: payment-service,    key: credentials,    output: "secret/staging/aws/application/payment-service/credentials" }
  - { env: staging, kind: rds,    app: support-api,        key: database,       output: "secret/staging/rds/application/support-api/database" }
  - { env: prod,    kind: aurora, app: order-service,      key: cluster,        output: "secret/prod/aurora/application/order-service/cluster" }
  - { env: staging, kind: redis,  app: session-cache,      key: redis,          output: "secret/staging/redis/application/session-cache/redis" }
  - { env: staging, kind: kafka,  app: event-pipeline,     key: sasl,           output: "secret/staging/kafka/application/event-pipeline/sasl" }
  - { env: staging, kind: scylla, app: device-event-mesh,  key: connection,     output: "secret/staging/scylla/application/device-event-mesh/connection" }
  - { env: staging, kind: clickhouse, app: analytics-api,  key: connection,     output: "secret/staging/clickhouse/application/analytics-api/connection" }
  - { env: staging, kind: mongodb, app: device-registry,   key: documentdb,     output: "secret/staging/mongodb/application/device-registry/documentdb" }
  - { env: staging, kind: qdrant,  app: flywheel,          key: apikey,         output: "secret/staging/qdrant/application/flywheel/apikey" }
  - { env: staging, kind: mysql,  app: revenue-sharing,    key: cdb-cn,         output: "secret/staging/mysql/application/revenue-sharing/cdb-cn" }
  - { env: staging, kind: redis,  app: factory_service,    key: connection,     output: "secret/staging/redis/application/factory_service/connection" }  # kind:Database spec.app underscore
  - { env: staging, kind: sentry, app: naturehood,         key: project,        output: "secret/staging/sentry/application/naturehood/project" }
  - { env: prod,    kind: app,    app: support-api,        key: webhook-token,  output: "secret/prod/app/support-api/webhook-token" }
  - { env: legacy,  kind: app,    app: tracker-frontend,   key: sentry-dsn,     output: "secret/tracker-frontend/staging-us/sentry-dsn", legacy: true }
  - { env: legacy,  kind: app,    app: tracker-frontend,   key: sentry-dsn,     output: "secret/tracker-frontend/staging-eu-central-1/sentry-dsn", legacy: true }
  - { env: legacy,  kind: app,    app: release-tooling,    key: token,          output: "secret/release-tooling/dev-ap-southeast-1/token", legacy: true }
  - { env: legacy,  kind: app,    app: dvc-remote,         key: app,            output: "secret/dvc-remote/staging-us-gcp/app", legacy: true }

# =============================================================================
# 显式反模式 —— workflow 必须拒绝产出，validator 必须拦下。
# =============================================================================
forbidden_patterns:

  - pattern: "secret/<env>-<region>/* （env-region 作首段，如 secret/staging-us/...、secret/prod-eu/...）"
    reason: |
      首段必须是裸 env（dev/staging/pre/prod）。region 由 per-region Vault 实例
      （vault-{us,eu,cn}.builder.addx.live for staging）隐含，写进路径冗余且违规。
      共享中间件凭据走 platform-resource-credential 的 per-app 路径
      （secret/{env}/{platform}/application/{app}/{key}），**没有**独立的
      shared-middleware Vault 命名空间。已存在的
      secret/staging-{region}/shared-middleware/* 是待迁移存量（live backlog），
      validator 一律拦下，新产出禁止。
      区分：legacy-app-env-region（secret/<app>/<env>-<region>/...）env-region 在
      **第二段**、app 名在前，那是被接受的老路径——此禁令只针对 env-region 作**首段**。

  - pattern: "secret/{env}/app/shared/*"
    reason: 违反"一条路径一个 app 所有权"原则；共享凭据走 Plan A 跨 app reference。

  - pattern: "secret/cicd/<service>/<business-credential>"
    reason: 红线 7a——业务凭据 **永不** 进 cicd 路径。cicd 路径只给平台工具链自身。

  - pattern: "secret/{env}/<platform>/application/<app>/<key> with platform NOT in vault-paths/platforms.yaml"
    reason: platform 枚举是完整列表；新增 platform 必须先在 vault-paths/platforms.yaml 里登记。
