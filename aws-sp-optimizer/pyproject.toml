[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-sp-optimizer"
version = "0.1.0"
description = "Compute the optimal 1y No Upfront Compute SP commitment for an AWS Org payer"
requires-python = ">=3.10"
authors = [{ name = "qliu" }]

dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.99",
    "moto>=5.0",
    "responses>=0.25",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
aws-sp-optimizer = "scripts.aws_sp_optimizer:main"
aws-sp-optimizer-discover = "scripts.discover_orgs:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line-length handled separately

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # loosened during development; tightened in Phase 6
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
